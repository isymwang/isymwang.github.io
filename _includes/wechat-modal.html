{% if page.author and site.data.authors[page.author] %}
  {% assign wechat_author = site.data.authors[page.author] %}
{% else %}
  {% assign wechat_author = site.author %}
{% endif %}

{% if wechat_author.wechat_qr %}
<div class="wechat-modal" id="wechat-modal" hidden>
  <div class="wechat-modal__backdrop" data-wechat-close></div>
  <div class="wechat-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="wechat-modal-title" tabindex="-1">
    <button class="wechat-modal__close" type="button" data-wechat-close aria-label="Close WeChat QR code">&times;</button>
    <h2 class="wechat-modal__title" id="wechat-modal-title">Add me on WeChat</h2>
    <img class="wechat-modal__qr" src="{{ wechat_author.wechat_qr | relative_url }}" alt="WeChat QR code for {{ wechat_author.name }}">
    <p class="wechat-modal__hint">Scan the QR code with WeChat.</p>
  </div>
</div>
{% endif %}
