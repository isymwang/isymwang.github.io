<header class="masthead">
  <div class="masthead__inner-wrap site-header">
    <a class="site-wordmark" href="#about-me" aria-label="Yiming Wang — Homepage">YW<span aria-hidden="true">.</span></a>
    <nav class="site-navigation" aria-label="Main navigation" data-en-label="Main navigation" data-zh-label="主导航">
      {% for link in site.data.navigation.main %}
      <a href="{{ link.url }}"><span data-lang="en">{{ link.title }}</span><span data-lang="zh">{{ link.title_zh }}</span></a>
      {% endfor %}
    </nav>
    <div class="language-switch" role="group" aria-label="Language / 语言">
      <button type="button" data-set-language="en" aria-pressed="true" lang="en">EN</button>
      <button type="button" data-set-language="zh" aria-pressed="false" lang="zh-CN">中文</button>
    </div>
  </div>
</header>
